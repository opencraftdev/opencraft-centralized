[project]
name = "video-materials"
version = "0.1.0"
description = "Local AI News Brief runner — fetch picks, generate a <=2-min video brief via the Claude Code subscription, render a thumbnail, publish to Supabase."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "playwright>=1.44",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "supabase>=2.5",
]

[project.scripts]
video-materials = "run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["run"]
packages = ["video_materials"]
